[tool.poetry]
name = "alpaca-roundtable-trader"
version = "0.1.0"
description = "Automated trading system for US stocks using Alpaca, with an optional Oracle second opinion."
license = "MIT"
authors = ["AI <ai@example.com>"]
readme = "README.md"
packages = [{include = "trading_system", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
alpaca-py = ">=0.36,<0.45"
pandas = "^3.1.1"
numpy = ">=1.26,<3.0"
pydantic-settings = "^2.2.0"
SQLAlchemy = "^2.0.29"
alembic = "^1.13.1"
prometheus-client = "^0.26.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.24.0"
ruff = ">=0.3.5,<0.18.0"
mypy = ">=1.9,<3.0"
pytest-mock = "^3.16.0"
# tests/unit/test_safety_policy.py reads .safety-policy.yml. ruamel.yaml (pure Python; safety needs it
# anyway) replaced pyyaml, which has no wheel for Python 3.15.
"ruamel.yaml" = ">=0.18"
safety = "^3.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py315"
line-length = 100

[tool.ruff.lint]
# Pin the rules explicitly. Ruff's *default* rule set grows between releases: moving from
# 0.3 to 0.17 turned on pyupgrade, import sorting, blind-except and more, which flagged
# 385 places in code that had always passed. These are the rules the project has enforced
# all along (the defaults of the 0.3 line); widen the list on purpose, not by upgrading.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.15"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
# pytest-asyncio 1.x warns when this is unset; "function" is its documented default.
asyncio_default_fixture_loop_scope = "function"
testpaths = [
    "tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
