[tool.poetry]
name = "alpaca-roundtable-trader"
version = "0.1.0"
description = "Automated trading system for US stocks using Alpaca, with an optional AnythingLLM Oracle."
authors = ["AI <ai@example.com>"]
readme = "README.md"
packages = [{include = "trading_system", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
alpaca-py = "^0.36.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
pydantic-settings = "^2.2.0"
httpx = ">=0.27,<0.29"
SQLAlchemy = "^2.0.29"
alembic = "^1.13.1"
tenacity = "^9.1.4"
prometheus-client = "^0.26.0"
beautifulsoup4 = "^4.15.0"
chromadb = ">=0.6.0"
feedparser = "^6.0.14"

[tool.poetry.group.dev.dependencies]
pytest = ">=9.0.3"
pytest-asyncio = ">=0.24.0"
ruff = "^0.3.5"
mypy = ">=1.9,<3.0"
respx = "^0.23.1"
pytest-mock = "^3.16.0"
safety = "^3.8.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
