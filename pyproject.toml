[tool.poetry]
name = "alpaca-roundtable-trader"
version = "0.1.0"
description = "Automated trading system for US stocks using Alpaca, with an optional AnythingLLM Oracle."
authors = ["AI <ai@example.com>"]
readme = "README.md"
packages = [{include = "trading_system", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
alpaca-py = "^0.36.0"
pandas = "^2.2.0"
numpy = "^1.26.0"
pydantic-settings = "^2.2.0"
httpx = "^0.27.0"
SQLAlchemy = "^2.0.29"
alembic = "^1.13.1"
tenacity = "^9.1.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-asyncio = "^0.23.6"
ruff = "^0.3.5"
mypy = "^1.9.0"
respx = "^0.23.1"
pytest-mock = "^3.16.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
