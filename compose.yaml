name: alpaca-roundtable-trader

# One image (alpaca-roundtable-trader:latest, built from ./Dockerfile) and one named volume
# (alpaca_trader_var, mounted at /app/var). The volume is the ONLY copy of the system's data:
# the SQLite database trading.db (state, signals, orders, candles) and the log. There is no
# var/trading.db on the host any more; do not run the CLI on the host, run it in the container.
# Docker Desktop shows the containers under Containers and the volume under Volumes.
#
#   docker compose up -d                                          start trader and data
#   docker compose logs -f trader                                 follow the trading loop
#   docker compose exec trader python -m trading_system status    ask the running system
#   docker compose exec trader python -m trading_system backtest --days 90
#   docker compose exec trader python -m trading_system pause-entries   (and resume-entries)
#   docker compose build && docker compose up -d                  after a code change
#   docker compose down                                           stop; the volume stays
#   (never `docker compose down -v`: it deletes the volume, i.e. the database; the
#   archives in ./var/backups survive it, see the `backup` service)
#
# The keys are read from .env (git-ignored) by Compose itself; only the variables named below
# reach the containers, nothing else from .env does.

# Docker keeps what a container prints in a file that grows without a limit unless told otherwise.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-alpaca-env: &alpaca-env
  ALPACA_API_KEY: ${ALPACA_API_KEY:?Put ALPACA_API_KEY in .env}
  ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:?Put ALPACA_SECRET_KEY in .env}
  IS_PAPER: "true"
  DATABASE_URL: sqlite:///./var/trading.db

services:
  # The trading loop in dry-run mode: real data from Alpaca, simulated orders (nothing is sent
  # to the broker; `run --paper` would send paper orders and is not used here on purpose).
  # `exec` makes the loop PID 1, so `docker stop` reaches it as SIGTERM and it stops cleanly.
  trader:
    build: .
    image: alpaca-roundtable-trader:latest
    container_name: alpaca-trader
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    environment: *alpaca-env
    volumes:
      - trading_var:/app/var
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head || exit 1
        exec python -m trading_system run
    # `health` reads the loop's heartbeat file: unhealthy if the loop stopped ticking, cannot
    # read the market clock, has not looked at a bar for 20 minutes with the market open, or
    # had signals break before they became orders. Docker Desktop shows it; `docker ps` too.
    healthcheck:
      test: ["CMD", "python", "-m", "trading_system", "health"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 180s

  # Keeps the candle store (table market_bars: 15-minute and 1-hour bars of the watchlist, 180
  # days) up to date once an hour in the same database. An update takes a few seconds. Read-only
  # calls to Alpaca: it never places an order.
  data:
    image: alpaca-roundtable-trader:latest
    container_name: alpaca-trader-data
    restart: unless-stopped
    logging: *logging
    environment: *alpaca-env
    volumes:
      - trading_var:/app/var
    command:
      - sh
      - -c
      - |
        python -m alembic upgrade head || exit 1
        while true; do
          python -m trading_system fetch-history --days 180 && touch /app/var/data_ok
          sleep 3600
        done
    # data_ok is touched after every successful download: older than 2.5 hours = two failed runs.
    healthcheck:
      test: ["CMD-SHELL", "find /app/var/data_ok -mmin -150 | grep -q ."]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 5m

  # The archive of the database OUTSIDE Docker. Every BACKUP_INTERVAL_SECONDS (default 6 hours,
  # first one at start) it writes a checked, compressed snapshot to ./var/backups on the PC
  # and keeps the newest BACKUP_KEEP (default 28 = a week). It gets no Alpaca keys. If a backup
  # fails the log says "Backup FAILED" (`docker compose logs backup`) and it tries again at the
  # next interval. Restore: see docs/operations.md.
  backup:
    image: alpaca-roundtable-trader:latest
    container_name: alpaca-trader-backup
    restart: unless-stopped
    logging: *logging
    environment:
      DATABASE_URL: sqlite:///./var/trading.db
    volumes:
      - trading_var:/app/var
      - ./var/backups:/backups
    command:
      - sh
      - -c
      - |
        while true; do
          python -m trading_system backup-db --out /backups --keep ${BACKUP_KEEP:-28}
          sleep ${BACKUP_INTERVAL_SECONDS:-21600}
        done
    # An archive newer than 7 hours exists (one every 6).
    healthcheck:
      test: ["CMD-SHELL", "find /backups -name 'trading-*.db.gz' -mmin -420 | grep -q ."]
      interval: 10m
      timeout: 10s
      retries: 1
      start_period: 3m

  # For one-off commands against the same database. Not started by `docker compose up`:
  #   docker compose run --rm app python -m trading_system status
  app:
    image: alpaca-roundtable-trader:latest
    profiles: ["tools"]
    environment: *alpaca-env
    volumes:
      - trading_var:/app/var

volumes:
  trading_var:
    name: alpaca_trader_var
