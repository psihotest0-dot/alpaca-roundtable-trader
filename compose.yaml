services:
  app:
    build: .
    # One name for the image whether it is built with `docker build -t` or `docker compose build`.
    image: alpaca-roundtable-trader:latest
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=sqlite:///local.db
    # No Chroma service: the news store is a local directory (CHROMA_DB_PATH), opened in-process.
