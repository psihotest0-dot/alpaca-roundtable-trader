security:
  ignore-vulnerabilities:
    # chromadb 1.5.9 is a main dependency (the RSS news store, in-process only). These five are
    # flaws of Chroma's SERVER (its HTTP API and its authorization providers). This project never
    # starts a Chroma server and nothing can reach one: it opens a local PersistentClient. No fixed
    # release is named in the advisories. Chroma is being removed (decisions.md, 2026-11-02): drop
    # these five entries together with the dependency.
    SFTY-20260518-81716:
      reason: "CVE-2026-45829, pre-auth code injection in Chroma's server HTTP API; no server here (in-process client only), Chroma is being removed"
      expires: 2027-03-01
    SFTY-20260612-19125:
      reason: "CVE-2026-45833, code injection in Chroma's server collection-update endpoint; no server here, Chroma is being removed"
      expires: 2027-03-01
    SFTY-20260612-67432:
      reason: "CVE-2026-45832, IDOR in Chroma's server V1 HTTP endpoints; no server here, Chroma is being removed"
      expires: 2027-03-01
    SFTY-20260612-21661:
      reason: "CVE-2026-45831, Chroma's SimpleRBACAuthorizationProvider (server authorization); no server here, Chroma is being removed"
      expires: 2027-03-01
    SFTY-20260612-61402:
      reason: "CVE-2026-45830, tenant access control bypass for authenticated network users of a Chroma server; no server here, Chroma is being removed"
      expires: 2027-03-01
    # nltk 3.10.3 is a dev-group dependency only (not in the Docker image) and nothing in src/ imports it.
    SFTY-20260902-58666:
      reason: "CVE-2026-81726, path traversal in nltk's parser/tagger save and load functions, which nothing here calls; dev-group only"
      expires: 2027-03-01
