name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      - name: Install project
        run: poetry install --no-interaction
      - name: Secret Scanning (Regex)
        run: |
          # Basic secret scanning to catch obvious issues in MVP
          if grep -rniE "ALPACA_API_KEY\s*=\s*['\"][A-Z0-9]+['\"]" src/ tests/; then
            echo "Secrets found in codebase!"
            exit 1
          fi
          if grep -rniE "ANYTHINGLLM_API_KEY\s*=\s*['\"][A-Z0-9]+['\"]" src/ tests/; then
            echo "Secrets found in codebase!"
            exit 1
          fi

      - name: Dependency Vulnerability Check
        run: |
          poetry run pip install safety
          poetry export -f requirements.txt | poetry run safety check --stdin

      - name: Run Ruff Check
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

      - name: Run Mypy
        run: poetry run mypy src

      - name: Migration Smoke Test
        run: |
          poetry run alembic upgrade head
          poetry run alembic downgrade base

      - name: Run Pytest
        run: poetry run pytest
