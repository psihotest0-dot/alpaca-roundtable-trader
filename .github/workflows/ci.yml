name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# CI only reads the repository; it needs no write access and uses no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hygiene:
    # Same checks as the local pre-commit hooks, so they cannot be skipped with
    # `git commit --no-verify`: secret patterns, forbidden runtime files, ruff,
    # whitespace and line endings.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.2
      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python 3.11
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      - name: Install project
        run: poetry install --no-interaction
      - name: Secret Scanning (Regex)
        run: |
          # Basic secret scanning to catch obvious issues in MVP
          # Exclude test files since they use dummy keys (e.g. "dummy", "test", "k")
          # Using || true to prevent set -e from killing the script if grep finds nothing
          bad_alpaca=$(grep -rnIE "ALPACA_API_KEY\s*=\s*['\"][A-Za-z0-9]{10,}['\"]" src/ tests/ | grep -v -i "dummy" | grep -v -i "secret" | grep -v -i "test" | grep -v -i "mock" | grep -v "test_key" | grep -v "test_secret" || true)
          if [ -n "$bad_alpaca" ]; then
            echo "Alpaca secrets found in codebase!"
            echo "$bad_alpaca"
            exit 1
          fi

          bad_llm=$(grep -rnIE "ANYTHINGLLM_API_KEY\s*=\s*['\"][A-Za-z0-9]{10,}['\"]" src/ tests/ | grep -v -i "dummy" | grep -v -i "secret" | grep -v -i "test" | grep -v -i "mock" | grep -v "test_key" | grep -v "test_secret" || true)
          if [ -n "$bad_llm" ]; then
            echo "AnythingLLM secrets found in codebase!"
            echo "$bad_llm"
            exit 1
          fi

      - name: Dependency Vulnerability Check
        run: |
          poetry run pip install safety
          poetry self add poetry-plugin-export@^1.8.0 && poetry export -f requirements.txt | poetry run safety check --stdin

      - name: Run Ruff Check
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

      - name: Run Mypy
        run: poetry run mypy src

      - name: Migration Smoke Test
        run: |
          mkdir -p var
          poetry run alembic upgrade head
          poetry run alembic downgrade base

      - name: Run Pytest
        run: poetry run pytest
