name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.8.2
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
        run: poetry install --no-interaction --no-root
      - name: Install project
        run: poetry install --no-interaction
      - name: Secret Scanning (Regex)
        run: |
          # Basic secret scanning to catch obvious issues in MVP
          # Exclude test files since they use dummy keys (e.g. "dummy", "test", "k")
          # Using || true to prevent set -e from killing the script if grep finds nothing
          bad_alpaca=$(grep -rnIE "ALPACA_API_KEY\s*=\s*['\"][A-Za-z0-9]{10,}['\"]" src/ tests/ | grep -v -i "dummy" | grep -v -i "secret" | grep -v -i "test" || true)
          if [ -n "$bad_alpaca" ]; then
            echo "Alpaca secrets found in codebase!"
            echo "$bad_alpaca"
            exit 1
          fi

          bad_llm=$(grep -rnIE "ANYTHINGLLM_API_KEY\s*=\s*['\"][A-Za-z0-9]{10,}['\"]" src/ tests/ | grep -v -i "dummy" | grep -v -i "secret" | grep -v -i "test" || true)
          if [ -n "$bad_llm" ]; then
            echo "AnythingLLM secrets found in codebase!"
            echo "$bad_llm"
            exit 1
          fi

      - name: Dependency Vulnerability Check
        run: |
          poetry run pip install safety
          poetry self add poetry-plugin-export@^1.8.0 && poetry export -f requirements.txt | poetry run safety check --stdin --ignore 67432 --ignore 21661 --ignore 19125 --ignore 61402 --ignore 81716 --ignore 58666 --ignore 69199 --ignore 60812 --ignore 69629 --ignore 70233 --ignore 20373

      - name: Run Ruff Check
        run: poetry run ruff check .

      - name: Run Ruff Format Check
        run: poetry run ruff format --check .

      - name: Run Mypy
        run: poetry run mypy src

      - name: Migration Smoke Test
        run: |
          mkdir -p var
          poetry run alembic upgrade head
          poetry run alembic downgrade base

      - name: Run Pytest
        run: poetry run pytest
