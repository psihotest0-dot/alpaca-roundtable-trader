# Weekly dependency and workflow updates. Security alerts themselves must be
# enabled in the repository settings (Code security and analysis).
version: 2
updates:
  # Covers pyproject.toml / poetry.lock.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels: ["dependencies"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    labels: ["dependencies"]
    # The Python version is a project decision (pyproject, CI and the image must agree),
    # not something to bump automatically. PR #25 once moved the image to 3.15 before the
    # locked dependencies could install there (the move was made by hand on 2026-11-13).
    # Patch updates of the 3.15 image still arrive with the base image itself.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
